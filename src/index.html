<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uragami-todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="paper">
      <header class="head">
        <h1 id="date">今日のこと</h1>
        <p id="count" class="count"></p>
      </header>

      <p id="notice" class="notice" hidden></p>

      <section>
        <ul id="today" class="list"></ul>
        <form id="add-form" class="add">
          <input id="add-input" type="text" placeholder="＋" autocomplete="off" />
        </form>
      </section>

      <section id="tomorrow-section" hidden>
        <h2 class="sub">明日やる</h2>
        <ul id="tomorrow" class="list list-tomorrow"></ul>
      </section>
    </main>

    <p id="toast" class="toast" hidden></p>
    <script src="main.js"></script>
  </body>
</html>
